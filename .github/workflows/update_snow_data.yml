name: "Auto Fetch Snow Data & Deploy"

on:
  schedule:
    # 毎時15分に自動実行（気象庁アメダスの毎時集計確定後に巡回）
    - cron: '15 * * * *'
  workflow_dispatch: # GitHub上の手動実行ボタン
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: "snow-data-update"
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Fetch Snow Data Script
        env:
          TZ: 'Asia/Tokyo'
        run: |
          node scripts/fetch_snow_data.js

      - name: Run Push Notification Engine
        continue-on-error: true
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node scripts/send_push_notification.js

      - name: Commit and push if data changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_japan.json scripts/notification_history.json scripts/road_snow_history.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: ❄️ 自動データ巡回更新 [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
