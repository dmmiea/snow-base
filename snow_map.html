<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POWDER BASE - 全国雪山マップ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
      background-color: #f1f5f9;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25);
      padding: 0;
      overflow: hidden;
      min-width: 240px;
      max-width: 290px;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4;
    }
    .leaflet-popup-tip {
      background-color: #ffffff;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #475569;
      padding: 8px 8px 0 0;
    }
    .leaflet-container a.leaflet-popup-close-button:hover {
      color: #0f172a;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 flex flex-col h-full overflow-hidden select-none">

  <!-- ===============================
       1. マップヘッダー（省スペーススリム設計）
       =============================== -->
  <header class="bg-white text-slate-900 px-3 py-1.5 shadow-sm z-20 border-b border-slate-200 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-6 h-6 rounded-lg bg-sky-700 flex items-center justify-center font-black text-white shadow text-xs">
        ❄️
      </div>
      <div>
        <h1 class="text-xs font-extrabold tracking-tight flex items-center gap-1.5 text-slate-900">
          <span id="mapTitleText">全国雪山マップ</span>
          <span id="mapCountBadge" class="text-[11px] bg-sky-50 text-sky-800 border border-sky-300 px-1.5 py-0.2 rounded-full font-mono font-bold">--地点</span>
        </h1>
      </div>
    </div>

    <!-- モード切替（📡 実測 / 🔮 予報） & 種別フィルター（🏂 スキー場 / ⛰️ BC山） -->
    <div class="flex items-center gap-1.5 flex-wrap justify-end">
      <!-- 予報 / 実測 トグル -->
      <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-300 text-[11px] font-bold">
        <button type="button" onclick="setMapSource('forecast')" id="btnSourceForecast" class="px-2 py-0.5 rounded bg-sky-700 text-white font-black shadow-sm transition">
          🔮 予報
        </button>
        <button type="button" onclick="setMapSource('live')" id="btnSourceLive" class="px-2 py-0.5 rounded text-slate-700 hover:text-slate-900 transition">
          📡 実測
        </button>
      </div>

      <!-- スキー場 / BC山 トグル -->
      <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-300 text-[11px] font-bold">
        <button type="button" onclick="filterCategory('ski')" id="btnCatSki" class="px-2.5 py-0.5 rounded bg-sky-700 text-white font-black shadow-sm transition">
          🏂 スキー場
        </button>
        <button type="button" onclick="filterCategory('bc')" id="btnCatBc" class="px-2.5 py-0.5 rounded text-slate-700 hover:text-slate-900 transition">
          ⛰️ BC山
        </button>
      </div>
    </div>
  </header>

  <!-- ===============================
       1.5 実測期間セレクターバー（実測モード時のみ表示）
       =============================== -->
  <div id="mapLivePeriodBar" class="hidden bg-sky-50/95 border-b border-sky-200 px-3 py-1 flex items-center justify-between gap-1 text-xs z-15">
    <div class="flex items-center gap-1 text-[11px] font-bold text-sky-950">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="mapLiveBarLabel">公的観測所 実測降雪:</span>
    </div>
    <div class="flex items-center gap-1 bg-white p-0.5 rounded-lg border border-sky-300 text-[10.5px] font-bold shadow-sm">
      <button type="button" onclick="setMapLivePeriod('night')" id="btnMapLiveNight" class="px-2 py-0.5 rounded bg-sky-700 text-white font-black shadow-xs transition">
        🌙 夜間
      </button>
      <button type="button" onclick="setMapLivePeriod('6h')" id="btnMapLive6h" class="px-2 py-0.5 rounded text-slate-700 hover:text-slate-900 transition">
        6h
      </button>
      <button type="button" onclick="setMapLivePeriod('12h')" id="btnMapLive12h" class="px-2 py-0.5 rounded text-slate-700 hover:text-slate-900 transition">
        12h
      </button>
      <button type="button" onclick="setMapLivePeriod('24h')" id="btnMapLive24h" class="px-2 py-0.5 rounded text-slate-700 hover:text-slate-900 transition">
        24h
      </button>
    </div>
  </div>

  <!-- ===============================
       2. 地域クイックジャンプバー（横スクロール）
       =============================== -->
  <nav class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-2 py-1.5 flex items-center gap-1.5 overflow-x-auto hide-scrollbar z-10 text-xs">
    <span id="mapRegionLabel" class="text-[11px] font-bold text-slate-700 uppercase tracking-wider whitespace-nowrap mr-0.5">地域:</span>
    <button onclick="jumpToRegion('all')" class="region-pill active px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-sky-700 text-white shadow-sm transition text-[11px]" data-region="all">全国</button>
    <button onclick="jumpToRegion('hokkaido')" class="region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]" data-region="hokkaido">北海道</button>
    <button onclick="jumpToRegion('tohoku')" class="region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]" data-region="tohoku">東北</button>
    <button onclick="jumpToRegion('shinetsu')" class="region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]" data-region="shinetsu">信越・妙高</button>
    <button onclick="jumpToRegion('hakuba')" class="region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]" data-region="hakuba">❄️ 白馬エリア</button>
    <button onclick="jumpToRegion('yuzawa')" class="region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]" data-region="yuzawa">上越・湯沢</button>
    <button onclick="jumpToRegion('gunma')" class="region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]" data-region="gunma">群馬・尾瀬</button>
    <button onclick="jumpToRegion('hokuriku')" class="region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]" data-region="hokuriku">北陸</button>
    <button onclick="jumpToRegion('west')" class="region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]" data-region="west">西日本・中四国</button>
  </nav>

  <!-- ===============================
       3. 地図メインコンテナ
       =============================== -->
  <div class="relative flex-1 bg-slate-100 overflow-hidden">
    <div id="map"></div>

    <!-- 左下：凡例カード（7段階 🌙夜間新雪基準・折りたたみ対応） -->
    <div id="legendCard" class="absolute bottom-3 left-3 z-10 bg-white/95 backdrop-blur-md rounded-xl p-2.5 shadow-lg border border-slate-300 text-xs pointer-events-auto max-w-[210px] transition-all duration-200">
      <button type="button" onclick="toggleLegend()" class="w-full font-bold text-slate-900 flex items-center justify-between text-[11px] cursor-pointer hover:text-sky-700 transition gap-2 select-none">
        <span id="mapLegendTitle" class="flex items-center gap-1">🌙 凡例（夜間新雪）</span>
        <i id="legendChevron" class="fa-solid fa-chevron-down text-[11px] text-slate-600 transition-transform duration-200"></i>
      </button>
      <div id="legendContent" class="space-y-1 pt-2 border-t border-slate-200 mt-1.5 text-[10.5px]">
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded-full bg-fuchsia-600 border border-slate-900 shrink-0 shadow-sm"></span>
          <span id="legWaist" class="text-fuchsia-800 font-bold">腰パウ (80cm+)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded-full bg-violet-600 border border-slate-900 shrink-0 shadow-sm"></span>
          <span id="legThigh" class="text-violet-800 font-bold">モモパウ (50〜79cm)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded-full bg-orange-600 border border-slate-900 shrink-0"></span>
          <span id="legKnee" class="text-orange-800 font-bold">ヒザパウ (30〜49cm)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded-full bg-amber-500 border border-slate-900 shrink-0"></span>
          <span id="legShin" class="text-amber-800 font-bold">スネパウ (20〜29cm)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded-full bg-sky-600 border border-slate-900 shrink-0"></span>
          <span id="legAnkle" class="text-sky-800 font-bold">くるぶし (10〜19cm)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded-full bg-emerald-600 border border-slate-900 shrink-0"></span>
          <span id="legDust" class="text-emerald-800 font-semibold">うっすら (1〜9cm)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded-full bg-slate-500 border border-slate-700 shrink-0"></span>
          <span id="legNone" class="text-slate-700 font-medium">降雪なし (0cm)</span>
        </div>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script>
    let map = null;
    let allSpots = [];
    let activeCategory = 'ski'; // デフォルトはスキー場
    let activeSource = 'forecast'; // 'forecast' または 'live' (初期表示は予報)
    let activeLivePeriod = 'night'; // 'night', '6h', '12h', '24h'
    let markersLayer = null;
    let legendOpen = true;
    let currentLang = window.currentLang || 'ja';
    let enNamesDict = {};

    // 英語辞書読み込み
    try {
      const storedLang = localStorage.getItem('powderbase_lang');
      if (storedLang === 'en' || storedLang === 'ja') {
        currentLang = storedLang;
        window.currentLang = storedLang;
      }
    } catch (_) {}

    fetch('en_names.json')
      .then(res => res.json())
      .then(d => {
        enNamesDict = d || {};
        if (allSpots.length > 0) renderMarkers();
      })
      .catch(() => {});

    function tName(name) {
      if (!name) return '';
      if (currentLang === 'en' && enNamesDict[name]) return enNamesDict[name];
      return name;
    }

    const I18N_MAP = {
      ja: {
        title: '全国雪山マップ',
        countSuffix: '地点',
        catSki: '🏂 スキー場',
        catBc: '⛰️ BC山',
        sourceForecast: '🔮 予報',
        sourceLive: '📡 実測',
        liveBarLabel: '公的観測所 実測降雪:',
        livePeriodNight: '🌙 夜間',
        livePeriod6h: '6h',
        livePeriod12h: '12h',
        livePeriod24h: '24h',
        regionLabel: '地域:',
        regAll: '全国',
        regHokkaido: '北海道',
        regTohoku: '東北',
        regShinetsu: '信越・妙高',
        regHakuba: '❄️ 白馬エリア',
        regYuzawa: '上越・湯沢',
        regGunma: '群馬・尾瀬',
        regHokuriku: '北陸',
        regWest: '西日本・中四国',
        legendTitle: '🌙 凡例（夜間新雪）',
        legendTitleLive: '📡 凡例（実測降雪）',
        legWaist: '腰パウ (80cm+)',
        legThigh: 'モモパウ (50〜79cm)',
        legKnee: 'ヒザパウ (30〜49cm)',
        legShin: 'スネパウ (20〜29cm)',
        legAnkle: 'くるぶし (10〜19cm)',
        legDust: 'うっすら (1〜9cm)',
        legNone: '降雪なし (0cm)',
        tierWaist: '腰パウ',
        tierThigh: 'モモパウ',
        tierKnee: 'ヒザパウ',
        tierShin: 'スネパウ',
        tierAnkle: 'くるぶし',
        tierDust: 'うっすら',
        tierNone: '降雪なし',
        popSki: '🏂 スキー場',
        popBc: '⛰️ バックカントリー',
        popNightSnow: '🌙 夜間新雪 (18-06時)',
        popLiveSnowfall: '降雪量',
        popTopSnow: '山頂 積雪深',
        popLiveSnowDepth: '実測 積雪深',
        popLiveStation: '観測所:',
        popLiveStationAmedas: 'アメダス',
        popLiveStationRoad: '道路雪量計',
        popLiveSubsidence: '沈降',
        popLiveFreshness: '鮮度',
        popLiveTemp: '気温',
        popElev: '標高:',
        popSnowQuality: '雪質:',
        popBcQuality: '山岳:',
        popScorePt: '点',
        popViewForecast: 'このスポットの予報を見る',
        tagLowSnow: '積雪不足',
        tagClosed: '滑走不可',
        tagStable: '雪質安定',
        tagBcStable: '山岳安定'
      },
      en: {
        title: 'Japan Snow Map',
        countSuffix: ' Spots',
        catSki: '🏂 Ski Resort',
        catBc: '⛰️ Backcountry',
        sourceForecast: '🔮 Forecast',
        sourceLive: '📡 Observed',
        liveBarLabel: 'Live Gauges Snowfall:',
        livePeriodNight: '🌙 Night',
        livePeriod6h: '6h',
        livePeriod12h: '12h',
        livePeriod24h: '24h',
        regionLabel: 'Region:',
        regAll: 'All',
        regHokkaido: 'Hokkaido',
        regTohoku: 'Tohoku',
        regShinetsu: 'Shinetsu',
        regHakuba: '❄️ Hakuba',
        regYuzawa: 'Yuzawa',
        regGunma: 'Gunma',
        regHokuriku: 'Hokuriku',
        regWest: 'West',
        legendTitle: '🌙 Snowfall Legend',
        legendTitleLive: '📡 Observed Snow Legend',
        legWaist: 'Waist (80cm+)',
        legThigh: 'Thigh (50-79cm)',
        legKnee: 'Knee (30-49cm)',
        legShin: 'Shin (20-29cm)',
        legAnkle: 'Ankle (10-19cm)',
        legDust: 'Dusting (1-9cm)',
        legNone: 'No Snowfall (0cm)',
        tierWaist: 'Waist Pow',
        tierThigh: 'Thigh Pow',
        tierKnee: 'Knee Pow',
        tierShin: 'Shin Pow',
        tierAnkle: 'Ankle',
        tierDust: 'Dusting',
        tierNone: 'No Snowfall',
        popSki: '🏂 Ski Resort',
        popBc: '⛰️ Backcountry',
        popNightSnow: '🌙 Overnight Snow (18-06h)',
        popLiveSnowfall: 'Snowfall',
        popTopSnow: 'Top Snow Depth',
        popLiveSnowDepth: 'Live Depth',
        popLiveStation: 'Station:',
        popLiveStationAmedas: 'AMeDAS',
        popLiveStationRoad: 'Road Gauge',
        popLiveSubsidence: 'Settling',
        popLiveFreshness: 'Freshness',
        popLiveTemp: 'Temp',
        popElev: 'Elev:',
        popSnowQuality: 'Snow:',
        popBcQuality: 'Mountain:',
        popScorePt: ' pts',
        popViewForecast: 'View Forecast',
        tagLowSnow: 'Low Snow',
        tagClosed: 'Closed',
        tagStable: 'Stable Snow',
        tagBcStable: 'Stable'
      }
    };

    function applyMapLanguage(lang) {
      if (lang) currentLang = lang;
      window.currentLang = currentLang;
      const dict = I18N_MAP[currentLang] || I18N_MAP.ja;

      const tTitle = document.getElementById('mapTitleText');
      if (tTitle) tTitle.textContent = dict.title;

      const bFc = document.getElementById('btnSourceForecast');
      if (bFc) bFc.textContent = dict.sourceForecast;

      const bLv = document.getElementById('btnSourceLive');
      if (bLv) bLv.textContent = dict.sourceLive;

      const barLbl = document.getElementById('mapLiveBarLabel');
      if (barLbl) barLbl.textContent = dict.liveBarLabel;

      const bNight = document.getElementById('btnMapLiveNight');
      if (bNight) bNight.textContent = dict.livePeriodNight;
      const b6h = document.getElementById('btnMapLive6h');
      if (b6h) b6h.textContent = dict.livePeriod6h;
      const b12h = document.getElementById('btnMapLive12h');
      if (b12h) b12h.textContent = dict.livePeriod12h;
      const b24h = document.getElementById('btnMapLive24h');
      if (b24h) b24h.textContent = dict.livePeriod24h;

      const bSki = document.getElementById('btnCatSki');
      if (bSki) bSki.textContent = dict.catSki;

      const bBc = document.getElementById('btnCatBc');
      if (bBc) bBc.textContent = dict.catBc;

      const regLbl = document.getElementById('mapRegionLabel');
      if (regLbl) regLbl.textContent = dict.regionLabel;

      const regMap = {
        all: dict.regAll,
        hokkaido: dict.regHokkaido,
        tohoku: dict.regTohoku,
        shinetsu: dict.regShinetsu,
        hakuba: dict.regHakuba,
        yuzawa: dict.regYuzawa,
        gunma: dict.regGunma,
        hokuriku: dict.regHokuriku,
        west: dict.regWest
      };
      document.querySelectorAll('.region-pill').forEach(btn => {
        const reg = btn.dataset.region;
        if (regMap[reg]) btn.textContent = regMap[reg];
      });

      const legTitle = document.getElementById('mapLegendTitle');
      if (legTitle) {
        legTitle.innerHTML = activeSource === 'live'
          ? `<i class="fa-solid fa-satellite-dish text-[11px] text-emerald-600 mr-1"></i>${dict.legendTitleLive}`
          : `<span class="mr-1">🌙</span>${dict.legendTitle}`;
      }

      const legIds = {
        legWaist: dict.legWaist,
        legThigh: dict.legThigh,
        legKnee: dict.legKnee,
        legShin: dict.legShin,
        legAnkle: dict.legAnkle,
        legDust: dict.legDust,
        legNone: dict.legNone
      };
      Object.keys(legIds).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = legIds[id];
      });

      if (allSpots && allSpots.length > 0) {
        renderMarkers();
      }
    }

    // 地域ごとの座標・ズーム設定
    const REGION_COORDS = {
      all: { center: [37.5, 137.5], zoom: 6 },
      hokkaido: { center: [43.2, 142.3], zoom: 7 },
      tohoku: { center: [39.5, 140.5], zoom: 7 },
      shinetsu: { center: [36.8, 138.2], zoom: 9 },
      hakuba: { center: [36.7, 137.85], zoom: 11 },
      yuzawa: { center: [36.95, 138.8], zoom: 10 },
      gunma: { center: [36.75, 139.0], zoom: 9 },
      hokuriku: { center: [36.3, 136.5], zoom: 8 },
      west: { center: [35.3, 134.5], zoom: 8 }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      applyMapLanguage();
      initMap();
      await loadSpotsData();
      
      // ハッシュまたはクエリパラメータ指定による初期地域ジャンプ
      const hash = window.location.hash.replace('#', '');
      const urlParams = new URLSearchParams(window.location.search);
      const regParam = urlParams.get('region') || hash;
      if (regParam && REGION_COORDS[regParam]) {
        jumpToRegion(regParam);
      }
    });

    function initMap() {
      // 国土地理院 淡色地図タイル（絶対に落ちず、日本の山岳地形・等高線が超鮮明）
      map = L.map('map', { zoomControl: false }).setView([37.5, 137.5], 6);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>',
        maxZoom: 18,
        minZoom: 5
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);

      // 親ウィンドウからのメッセージ受信（タブ切り替え時の invalidateSize 実行 & 言語変更）
      window.addEventListener('message', (e) => {
        if (!e.data) return;
        if (e.data.action === 'INVALIDATE_MAP') {
          setTimeout(() => { if (map) map.invalidateSize(); }, 50);
        }
        if (e.data.action === 'SET_LANG') {
          applyMapLanguage(e.data.lang);
        }
      });
    }

    async function loadSpotsData() {
      try {
        const res = await fetch('data_japan.json');
        if (!res.ok) throw new Error('data_japan.json load error');
        const data = await res.json();
        allSpots = data.spots || [];
        applyMapLanguage();
        renderMarkers();
      } catch (err) {
        console.error('Failed to load spots data:', err);
      }
    }

    // ホーム画面と完全連動する「夜間新雪量（18-06時）」取得ロジック
    function getSpotNightSnow(s) {
      if (!s || !s.nightSnowByDate) return 0;
      const jstNow = new Date(Date.now() + 9 * 3600000);
      const jstHour = jstNow.getUTCHours();
      const targetMorning = new Date(jstNow.getTime() + (jstHour >= 12 ? 24 * 3600000 : 0));
      const target06Str = `${targetMorning.toISOString().slice(0, 10)}T06:00`;
      const nightKeys = Object.keys(s.nightSnowByDate);
      if (s.nightSnowByDate[target06Str] !== undefined) {
        return s.nightSnowByDate[target06Str];
      }
      const upcoming = nightKeys.filter(k => k >= target06Str);
      if (upcoming.length > 0) return s.nightSnowByDate[upcoming[0]];
      if (nightKeys.length > 0) return s.nightSnowByDate[nightKeys[nightKeys.length - 1]];
      return 0;
    }

    // ホーム画面の判定基準と完全一致する7段階新雪設定（ゴーグル耐性高コントラスト）
    function getNightSnowTier(val) {
      const v = typeof val === 'number' ? val : 0;
      const isEn = currentLang === 'en';
      const dict = I18N_MAP[currentLang] || I18N_MAP.ja;
      if (v >= 80) return { label: dict.tierWaist, bg: '#c026d3', badgeCls: 'bg-fuchsia-600', textCls: 'text-fuchsia-700', isDeep: true };
      if (v >= 50) return { label: dict.tierThigh, bg: '#7c3aed', badgeCls: 'bg-violet-600', textCls: 'text-violet-700', isDeep: true };
      if (v >= 30) return { label: dict.tierKnee, bg: '#ea580c', badgeCls: 'bg-orange-600', textCls: 'text-orange-700', isDeep: true };
      if (v >= 20) return { label: dict.tierShin, bg: '#f59e0b', badgeCls: 'bg-amber-600', textCls: 'text-amber-700', isDeep: true };
      if (v >= 10) return { label: dict.tierAnkle, bg: '#0284c7', badgeCls: 'bg-sky-600', textCls: 'text-sky-700', isDeep: false };
      if (v >= 1) return { label: dict.tierDust, bg: '#059669', badgeCls: 'bg-emerald-600', textCls: 'text-emerald-700', isDeep: false };
      return { label: dict.tierNone, bg: '#64748b', badgeCls: 'bg-slate-500', textCls: 'text-slate-600', isDeep: false };
    }

    function setMapSource(source) {
      activeSource = source;
      const bFc = document.getElementById('btnSourceForecast');
      const bLv = document.getElementById('btnSourceLive');
      const liveBar = document.getElementById('mapLivePeriodBar');

      if (source === 'live') {
        if (bFc) bFc.className = "px-2 py-0.5 rounded text-slate-700 hover:text-slate-900 transition";
        if (bLv) bLv.className = "px-2 py-0.5 rounded bg-sky-700 text-white font-black shadow-sm transition";
        if (liveBar) liveBar.classList.remove('hidden');
      } else {
        if (bFc) bFc.className = "px-2 py-0.5 rounded bg-sky-700 text-white font-black shadow-sm transition";
        if (bLv) bLv.className = "px-2 py-0.5 rounded text-slate-700 hover:text-slate-900 transition";
        if (liveBar) liveBar.classList.add('hidden');
      }

      const dict = I18N_MAP[currentLang] || I18N_MAP.ja;
      const legTitle = document.getElementById('mapLegendTitle');
      if (legTitle) {
        legTitle.innerHTML = activeSource === 'live'
          ? `<i class="fa-solid fa-satellite-dish text-[11px] text-emerald-600 mr-1"></i>${dict.legendTitleLive}`
          : `<span class="mr-1">🌙</span>${dict.legendTitle}`;
      }

      renderMarkers();
    }

    function setMapLivePeriod(period) {
      activeLivePeriod = period;
      const periods = ['night', '6h', '12h', '24h'];
      const mapBtns = {
        night: document.getElementById('btnMapLiveNight'),
        '6h': document.getElementById('btnMapLive6h'),
        '12h': document.getElementById('btnMapLive12h'),
        '24h': document.getElementById('btnMapLive24h')
      };

      periods.forEach(p => {
        const btn = mapBtns[p];
        if (!btn) return;
        if (p === period) {
          btn.className = "px-2 py-0.5 rounded bg-sky-700 text-white font-black shadow-xs transition";
        } else {
          btn.className = "px-2 py-0.5 rounded text-slate-700 hover:text-slate-900 transition";
        }
      });

      renderMarkers();
    }

    // スポットの実測降雪量（選択期間）を取得
    function getSpotLiveSnowfall(s) {
      const stats = s && s.current && s.current.liveAmedas && s.current.liveAmedas.stats;
      if (!stats) return 0;
      const periodStat = stats[activeLivePeriod];
      if (!periodStat || typeof periodStat.snowfall !== 'number') return 0;
      return periodStat.snowfall;
    }

    function renderMarkers() {
      if (!markersLayer) return;
      markersLayer.clearLayers();

      const dict = I18N_MAP[currentLang] || I18N_MAP.ja;

      const filtered = allSpots.filter(s => {
        if (activeCategory === 'ski') return s.category === 'ski';
        if (activeCategory === 'bc') return s.category === 'bc';
        return true;
      });

      document.getElementById('mapCountBadge').textContent = `${filtered.length}${dict.countSuffix}`;

      filtered.forEach(s => {
        if (!s.top || typeof s.top.lat !== 'number' || typeof s.top.lon !== 'number') return;

        const isBc = s.category === 'bc';
        const isLive = activeSource === 'live';

        // 予報 or 実測 に応じた降雪量と色分け判定
        const snowVal = isLive
          ? Math.round(getSpotLiveSnowfall(s) * 10) / 10
          : Math.round(getSpotNightSnow(s) * 10) / 10;
        const tier = getNightSnowTier(snowVal);
        const iconChar = isBc ? '⛰️' : '🏂';

        // サーフベース準拠の大きめ白枠ピン（L.divIcon）
        // 新雪があるスポットはピンを一回り強調し、右上に新雪量バッジを表示
        const pinSize = tier.isDeep ? 28 : (snowVal >= 1 ? 26 : 22);
        const badgeHtml = snowVal >= 1
          ? `<span class="absolute -top-2 -right-3 px-1 py-0.2 rounded-full ${tier.badgeCls} text-white font-black text-[9px] font-mono leading-none border border-slate-900 shadow-md pointer-events-none">+${snowVal}</span>`
          : '';

        const iconHtml = `
          <div class="relative flex items-center justify-center select-none" style="width: ${pinSize}px; height: ${pinSize}px;">
            <div class="w-full h-full rounded-full flex items-center justify-center text-white border-2 border-white shadow-lg text-[10px] sm:text-xs" style="background-color: ${tier.bg}; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));">
              ${iconChar}
            </div>
            ${badgeHtml}
          </div>
        `;

        const icon = L.divIcon({
          className: 'custom-snow-pin',
          html: iconHtml,
          iconSize: [pinSize, pinSize],
          iconAnchor: [pinSize / 2, pinSize / 2]
        });

        const marker = L.marker([s.top.lat, s.top.lon], { icon });

        const displayName = tName(s.name);
        const displayArea = tName(s.areaName || s.regionName);
        const topSnow = (s.current && s.current.topSnowDepth) || 0;
        const score = (s.current && typeof s.current.score === 'number') ? s.current.score : null;
        const rawTag = (s.current && s.current.tag) || (isBc ? '山岳安定' : '雪質安定');
        let tag = (typeof window.tTag === 'function') ? window.tTag(rawTag) : rawTag;

        const elev = (s.top && s.top.elevation) || 0;
        const windSpd = (s.current && typeof s.current.windSpeed === 'number') ? s.current.windSpeed : null;
        const windDir = (s.current && s.current.windDirText) ? s.current.windDirText : '';
        const bcAlert = (isBc && s.current && s.current.bcAlert) ? s.current.bcAlert : null;
        let bcAlertBadgeHtml = '';
        if (isBc) {
          const lvl = bcAlert ? bcAlert.level : (windSpd >= 15 ? 'HIGH' : (windSpd >= 10 || topSnow < 100 ? 'MODERATE' : 'LOW'));
          const rawLbl = bcAlert ? bcAlert.label : (lvl === 'HIGH' ? '入山警戒' : (lvl === 'MODERATE' ? '山岳注意' : '比較的安定'));
          const lbl = (typeof window.tTag === 'function') ? window.tTag(rawLbl) : rawLbl;
          const cls = lvl === 'HIGH'
            ? 'bg-rose-50 text-rose-800 border-rose-300'
            : (lvl === 'MODERATE' ? 'bg-amber-50 text-amber-800 border-amber-300' : 'bg-emerald-50 text-emerald-800 border-emerald-300');
          const aIcon = lvl === 'HIGH' ? '🔴' : (lvl === 'MODERATE' ? '🟡' : '🟢');
          const windLabel = currentLang === 'en' ? 'Wind' : '風';
          const windStr = windSpd !== null ? ` / ${windLabel}: ${windDir ? windDir + ' ' : ''}${windSpd}m/s` : '';
          bcAlertBadgeHtml = `<div class="col-span-2 px-2 py-1 rounded-lg border text-[10px] font-bold ${cls}">${aIcon} ${lbl}${windStr}</div>`;
        }

        let popupContentHtml = '';

        if (isLive) {
          // ==============================
          // 📡 実測モードのポップアップカード
          // ==============================
          const live = s.current && s.current.liveAmedas;
          const isRoad = live && live.source === 'mlit_road';
          const stationTypeLabel = isRoad ? dict.popLiveStationRoad : dict.popLiveStationAmedas;
          const stationName = live ? tName(live.stationName || '') : '―';
          const liveDepth = (live && typeof live.snowDepth === 'number') ? live.snowDepth : 0;
          
          const stats = live && live.stats && live.stats[activeLivePeriod];
          const subsidence = (stats && typeof stats.subsidence === 'number') ? stats.subsidence : 0;
          const freshness = stats && stats.freshness !== null && stats.freshness !== undefined ? `${stats.freshness}h` : '―';
          let tempStr = '―';
          if (stats && (stats.tempMax !== null || stats.tempMin !== null)) {
            const tMax = stats.tempMax !== null ? `${stats.tempMax}°` : '―';
            const tMin = stats.tempMin !== null ? `${stats.tempMin}°` : '―';
            tempStr = `${tMax}/${tMin}`;
          } else if (live && typeof live.temp === 'number') {
            tempStr = `${live.temp}°C`;
          }

          const periodLabelMap = {
            night: dict.livePeriodNight,
            '6h': '6h',
            '12h': '12h',
            '24h': '24h'
          };
          const periodTxt = periodLabelMap[activeLivePeriod] || '';

          popupContentHtml = `
            <div class="mb-2 bg-slate-100 rounded-lg px-2 py-1 flex items-center justify-between text-[10.5px]">
              <span class="font-bold text-slate-700 flex items-center gap-1">
                <i class="fa-solid fa-satellite-dish text-sky-700 text-[10px]"></i>
                <span>${stationTypeLabel}: <strong class="text-slate-900">${stationName}</strong></span>
              </span>
              <span class="text-[10px] px-1.5 py-0.2 rounded bg-sky-100 text-sky-800 font-bold border border-sky-200">📡 実測</span>
            </div>

            <div class="grid grid-cols-2 gap-1.5 bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-[11px] mb-2.5">
              <div>
                <span class="text-slate-600 font-semibold text-[10px] block">${periodTxt}${dict.popLiveSnowfall}</span>
                <span class="font-black font-mono text-base ${tier.textCls}">+${snowVal}</span> <span class="text-[10px] text-slate-600 font-bold">cm</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded ${tier.badgeCls} text-white font-bold ml-1 inline-block">${tier.label}</span>
              </div>
              <div>
                <span class="text-slate-600 font-semibold text-[10px] block">${dict.popLiveSnowDepth}</span>
                <span class="font-black text-slate-900 font-mono text-base">${liveDepth}</span> <span class="text-[10px] text-slate-600 font-bold">cm</span>
              </div>

              <!-- 実測指標 補助バー（沈降・鮮度・気温） -->
              <div class="col-span-2 pt-1.5 border-t border-slate-200 grid grid-cols-3 gap-1 text-[10.5px] text-center">
                <div class="bg-white p-1 rounded border border-slate-200">
                  <span class="text-[9.5px] text-slate-600 font-semibold block">${dict.popLiveSubsidence}</span>
                  <span class="font-mono font-bold text-slate-800">${subsidence > 0 ? '-' + subsidence + 'cm' : '0cm'}</span>
                </div>
                <div class="bg-white p-1 rounded border border-slate-200">
                  <span class="text-[9.5px] text-slate-600 font-semibold block">${dict.popLiveFreshness}</span>
                  <span class="font-mono font-bold text-sky-700">${freshness}</span>
                </div>
                <div class="bg-white p-1 rounded border border-slate-200">
                  <span class="text-[9.5px] text-slate-600 font-semibold block">${dict.popLiveTemp}</span>
                  <span class="font-mono font-bold text-slate-800">${tempStr}</span>
                </div>
              </div>

              <!-- 標高 & スコア/コンディション -->
              <div class="col-span-2 pt-1 border-t border-slate-200 flex flex-wrap items-center justify-between gap-x-2 gap-y-1 text-[11px]">
                <span class="text-slate-700 font-semibold whitespace-nowrap">${dict.popElev} ${elev}m</span>
                <div class="flex items-center gap-1.5 whitespace-nowrap">
                  <span class="text-slate-600 font-semibold">${isBc ? dict.popBcQuality : dict.popSnowQuality}</span>
                  <span class="font-black ${score !== null ? (isBc ? 'text-emerald-700' : 'text-sky-700') : 'text-slate-500'}">${score !== null ? score + dict.popScorePt : '―'}</span>
                  <span class="text-[10px] text-slate-800 font-bold px-1.5 py-0.5 bg-white rounded border border-slate-300 whitespace-nowrap">${tag}</span>
                </div>
              </div>
              ${bcAlertBadgeHtml}
            </div>
          `;
        } else {
          // ==============================
          // 🔮 予報モードのポップアップカード（既存維持）
          // ==============================
          popupContentHtml = `
            <div class="grid grid-cols-2 gap-1.5 bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-[11px] mb-2.5">
              <div>
                <span class="text-slate-600 font-semibold text-[10px] block">${dict.popNightSnow}</span>
                <span class="font-black font-mono text-base ${tier.textCls}">+${snowVal}</span> <span class="text-[10px] text-slate-600 font-bold">cm</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded ${tier.badgeCls} text-white font-bold ml-1 inline-block">${tier.label}</span>
              </div>
              <div>
                <span class="text-slate-600 font-semibold text-[10px] block">${dict.popTopSnow}</span>
                <span class="font-black text-slate-900 font-mono text-base">${topSnow}</span> <span class="text-[10px] text-slate-600 font-bold">cm</span>
              </div>
              <div class="col-span-2 pt-1.5 border-t border-slate-200 flex flex-wrap items-center justify-between gap-x-2 gap-y-1 text-[11px]">
                <span class="text-slate-700 font-semibold whitespace-nowrap">${dict.popElev} ${elev}m</span>
                <div class="flex items-center gap-1.5 whitespace-nowrap">
                  <span class="text-slate-600 font-semibold">${isBc ? dict.popBcQuality : dict.popSnowQuality}</span>
                  <span class="font-black ${score !== null ? (isBc ? 'text-emerald-700' : 'text-sky-700') : 'text-slate-500'}">${score !== null ? score + dict.popScorePt : '―'}</span>
                  <span class="text-[10px] text-slate-800 font-bold px-1.5 py-0.5 bg-white rounded border border-slate-300 whitespace-nowrap">${tag}</span>
                </div>
              </div>
              ${bcAlertBadgeHtml}
            </div>
          `;
        }

        const popupHtml = `
          <div class="p-3 text-slate-900 font-sans text-xs bg-white">
            <div class="flex items-center justify-between border-b border-slate-200 pb-1.5 mb-2 pr-6 gap-2">
              <span class="text-[11px] font-bold ${isBc ? 'text-emerald-800 bg-emerald-50 border-emerald-300' : 'text-sky-800 bg-sky-50 border-sky-300'} px-2 py-0.5 rounded border shrink-0">
                ${isBc ? dict.popBc : dict.popSki}
              </span>
              <span class="text-[11px] font-bold text-slate-600 truncate text-right">${displayArea}</span>
            </div>
            <div class="font-black text-sm text-slate-900 leading-tight mb-2 pr-4">${displayName}</div>
            
            ${popupContentHtml}

            <button type="button" onclick="goToSpot('${s.id}')" class="w-full py-2 px-3 rounded-lg ${isBc ? 'bg-emerald-700 hover:bg-emerald-800' : 'bg-sky-700 hover:bg-sky-800'} active:scale-95 text-white font-black text-xs flex items-center justify-center gap-1.5 shadow transition cursor-pointer">
              <span>${dict.popViewForecast}</span>
              <i class="fa-solid fa-arrow-right text-[11px]"></i>
            </button>
          </div>
        `;

        marker.bindPopup(popupHtml, { autoPanPadding: [20, 25] });
        marker.addTo(markersLayer);
      });
    }

    function filterCategory(cat) {
      activeCategory = cat;
      const bSki = document.getElementById('btnCatSki');
      const bBc = document.getElementById('btnCatBc');

      if (bSki) bSki.className = cat === 'ski' ? "px-2.5 py-1 rounded bg-sky-700 text-white font-black shadow-sm transition" : "px-2.5 py-1 rounded text-slate-700 hover:text-slate-900 transition";
      if (bBc) bBc.className = cat === 'bc' ? "px-2.5 py-1 rounded bg-sky-700 text-white font-black shadow-sm transition" : "px-2.5 py-1 rounded text-slate-700 hover:text-slate-900 transition";

      renderMarkers();
    }

    function jumpToRegion(regKey) {
      document.querySelectorAll('.region-pill').forEach(btn => {
        if (btn.dataset.region === regKey) {
          btn.className = "region-pill active px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-sky-700 text-white shadow-sm transition text-[11px]";
        } else {
          btn.className = "region-pill px-2.5 py-1 rounded-full font-bold whitespace-nowrap bg-slate-100 text-slate-800 border border-slate-300 hover:bg-slate-200 transition text-[11px]";
        }
      });

      const conf = REGION_COORDS[regKey] || REGION_COORDS.all;
      if (map) {
        map.flyTo(conf.center, conf.zoom, { duration: 1.2 });
      }
    }

    function goToSpot(spotId) {
      if (!spotId) return;
      // 親ウィンドウが存在する場合（iframe経由）
      if (window.parent && window.parent !== window && typeof window.parent.selectSpotFromMap === 'function') {
        window.parent.selectSpotFromMap(spotId);
      } else {
        // 直接開かれた場合
        window.location.href = 'index.html?spot=' + encodeURIComponent(spotId);
      }
    }

    function toggleLegend() {
      const content = document.getElementById('legendContent');
      const chevron = document.getElementById('legendChevron');
      legendOpen = !legendOpen;
      if (legendOpen) {
        content.classList.remove('hidden');
        chevron.style.transform = 'rotate(0deg)';
      } else {
        content.classList.add('hidden');
        chevron.style.transform = 'rotate(-90deg)';
      }
    }
  </script>
</body>
</html>
